name: Build and Release RPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'RPM version to build (defaults to the tag version, or 1.0.0 for a branch run)'
        required: false
        type: string
  push:
    tags:
      - 'v*'
  release:
    types: [published, created]

jobs:
  build-rpm:
    name: Build RPM Package
    runs-on: ubuntu-latest
    container:
      image: fedora:40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build nodejs npm tar gzip

      - name: Prepare source tarball and rpmbuild tree
        env:
          RPM_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$RPM_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.0"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9][0-9A-Za-z._+~]*$'; then
            echo "Invalid RPM version: $VERSION" >&2
            exit 1
          fi
          echo "Packaging version: $VERSION"

          mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

          sed -i "s/^Version:.*/Version:        ${VERSION}/" sane-icons.spec
          cp sane-icons.spec ~/rpmbuild/SPECS/

          TARBALL_DIR="sane-icons-${VERSION}"
          mkdir -p "/tmp/${TARBALL_DIR}"
          cp -r . "/tmp/${TARBALL_DIR}/"
          tar -czf ~/rpmbuild/SOURCES/sane-icons-${VERSION}.tar.gz -C /tmp "${TARBALL_DIR}"

      - name: Build RPM package
        run: |
          rpmbuild -ba ~/rpmbuild/SPECS/sane-icons.spec

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sane-icons-rpm
          path: ~/rpmbuild/RPMS/*/*.rpm

      - name: Upload RPM to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ~/rpmbuild/RPMS/*/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
